ShortDescription: See what is listening on your ports, from the tray, and stop it
Description: |-
  A door in the notification area that lists every program listening on a
  network port: the port, the process, what it was started with, how long it
  has been up, and whether it is reachable from the network or only from this
  machine. Open one in the browser, or stop the process, from the menu.

  For "port 3000 is already in use" and "which forgotten dev server is this?".
