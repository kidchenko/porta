[package]
name         = "porta"
version      = "0.0.1"
edition      = "2021"
rust-version = "1.77"
description  = "See what is listening on your ports, from the tray, and stop it"
authors      = ["kidchenko <kidchenko@gmail.com>"]
license      = "MIT"
repository   = "https://github.com/kidchenko/porta"

[[bin]]
name = "porta"
path = "src/main.rs"

[dependencies]
# Decodes the menu's icons (see art.rs). Already in the tree via tray-icon.
png        = "0.18"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tao        = "0.37"
tray-icon  = "0.24"

# ---------------------------------------------------------------------------
# Windows
# ---------------------------------------------------------------------------
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"

[target.'cfg(windows)'.dependencies.windows]
version  = "0.62"
features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# ---------------------------------------------------------------------------
# macOS
# ---------------------------------------------------------------------------
# `libc` is for localtime_r in the log stamp and proc_pidpath. objc2 is
# already in the tree via tao and tray-icon; AppKit is for apps' own icons
# (program_icon.rs) and withdrawing tao's launch activation (main.rs),
# Foundation for whether menus are dark (theme.rs) or open (app.rs).
[target.'cfg(target_os = "macos")'.dependencies]
libc             = "0.2"
objc2            = "0.6"
objc2-app-kit    = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSResponder", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSGeometry", "NSObjCRuntime", "NSRunLoop", "NSString", "NSUserDefaults"] }

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true
